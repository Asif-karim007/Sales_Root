name: salesroot
description: "SalesRoot — bilingual field-sales CRM."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  battery_plus: ^7.1.2
  cached_network_image: ^4.0.3
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  google_maps_flutter: ^2.18.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  sqflite: ^2.4.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.9

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekBangla-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekBangla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekBangla-Bold.ttf
          weight: 700
